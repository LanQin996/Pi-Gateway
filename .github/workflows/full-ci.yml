name: Full regression

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare a private Go toolchain for frontend checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          # Hosted toolcache ancestors can be writable by other users. Copy the
          # setup-go installation; do not weaken the resolver's trust checks.
          source_root="$(go env GOROOT)"
          private_root="$(mktemp -d /tmp/pi-gateway-go.XXXXXXXX)"
          cp -R "$source_root/." "$private_root/"
          chmod -R go-w "$private_root"
          printf 'GOROOT=%s\nPI_GO_BINARY=%s/bin/go\n' "$private_root" "$private_root" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm run check:capture
      - run: npm run check:rules
      - run: npm run check:sonar-regressions
      - run: npm run build
      - name: Resolve Playwright version for the browser cache
        id: playwright
        run: node -e 'console.log("version=" + require("@playwright/test/package.json").version)' >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}-chromium-headless-v1
      # OS packages are runner-local and must be checked even on a browser cache hit.
      - name: Install Chromium system dependencies
        run: ./node_modules/.bin/playwright install-deps chromium
      - name: Install Chromium headless shell and FFmpeg
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: ./node_modules/.bin/playwright install --only-shell chromium
      # Save before the tests so a test failure does not discard the download.
      - name: Save Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Run rules canvas and capture debugger browser tests
        run: npm run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rules-browser-failure
          path: |
            web/node_modules/.cache/playwright/test-results
            web/node_modules/.cache/playwright/report
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: internal/webui/dist
          if-no-files-found: error

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_gateway_test
          POSTGRES_USER: pi_gateway
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pi_gateway -d pi_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PI_GATEWAY_TEST_POSTGRES_DSN: postgres://pi_gateway:ci-postgres-password@127.0.0.1:5432/pi_gateway_test?sslmode=disable
      PI_GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: internal/webui/dist
      - run: go vet ./...
      - name: Validate the container smoke probe against a local gateway
        run: python3 -m unittest discover -s .github -p test_compose_smoke.py -v
      - name: Run unit and real-service integration tests
        shell: bash
        run: |
          set -euo pipefail
          # The API package includes the real backend matrix and hundreds of
          # protocol regressions; race instrumentation can exceed Go's default
          # 10-minute package timeout on hosted runners.
          go test -race -count=1 -timeout=30m -json ./... | tee test-results.jsonl
      - name: Require integration tests to execute successfully (no skips)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          results = Path('test-results.jsonl')
          assert results.is_file(), 'Go test results are missing; inspect the preceding test/build step'
          events = [json.loads(line) for line in results.read_text().splitlines()]
          required = {'TestPostgresStoreIntegration', 'TestRedisIntegration', 'TestBackendMatrixIntegration', 'TestRulesPostgresPublicationAndUpgrade', 'TestAccountManagementPostgresIntegration'}
          required.update(f'TestBackendMatrixIntegration/{variant}' for variant in ('sqlite-memory', 'sqlite-redis', 'postgres-memory', 'postgres-redis'))
          for test in sorted(required):
              matches = [event for event in events if event.get('Test') == test]
              if not any(event.get('Action') == 'pass' for event in matches) or any(event.get('Action') == 'skip' for event in matches):
                  packages = {event.get('Package') for event in matches}
                  print(f'--- Go test diagnostics: {test} ---', flush=True)
                  for event in events:
                      name = event.get('Test', '')
                      if name == test or name.startswith(test + '/') or (not name and event.get('Package') in packages):
                          if event.get('Output'):
                              print(event['Output'], end='', flush=True)
                  print(f"Terminal actions: {[event['Action'] for event in matches if event.get('Action') in ('pass', 'fail', 'skip')]}", flush=True)
              assert any(event.get('Action') == 'run' for event in matches), f'{test} did not run'
              assert not any(event.get('Action') == 'skip' for event in matches), f'{test} was skipped'
              assert any(event.get('Action') == 'pass' for event in matches), f'{test} did not pass; see Go diagnostics above'
          skipped = [event['Test'] for event in events if event.get('Action') == 'skip' and any(event.get('Test', '').startswith(test + '/') for test in required)]
          assert not skipped, f'Integration subtests were skipped: {skipped}'
          print('Real PostgreSQL/Redis contracts and all four protocol variants executed and passed.')
          PY

      - name: Validate and build the disposable TLS fixture
        run: |
          go vet ./.github/compose_tls
          go test -race -count=1 ./.github/compose_tls
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/compose-tls" ./.github/compose_tls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-tls-fixture
          path: ${{ runner.temp }}/compose-tls
          retention-days: 1
          if-no-files-found: error

  image:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and load the native AMD64 image for Compose tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: pi-gateway:ci-${{ github.sha }}
          # Reuse either workflow's layers without replacing the publish cache.
          cache-from: |
            type=gha,version=2,scope=pi-gateway-ci
            type=gha,version=2,scope=pi-gateway-publish
          cache-to: type=gha,version=2,scope=pi-gateway-ci,mode=max
      - name: Check runtime user and save the tested image
        env:
          TEST_IMAGE: pi-gateway:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' "$TEST_IMAGE")" = '10001:10001'
          docker save --output "$RUNNER_TEMP/pi-gateway-image.tar" "$TEST_IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pi-gateway-test-image
          path: ${{ runner.temp }}/pi-gateway-image.tar
          retention-days: 1
          if-no-files-found: error

  compose:
    needs: image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            files: -f compose.yaml
            redis: false
          - name: postgres
            files: -f compose.yaml -f compose.postgres.yaml
            redis: false
          - name: sqlite-redis
            files: -f compose.yaml -f compose.redis.yaml
            redis: true
          - name: postgres-redis
            files: -f compose.yaml -f compose.postgres.yaml -f compose.redis.yaml
            redis: true
    name: Compose (${{ matrix.name }})
    env:
      COMPOSE_PROJECT_NAME: pi-gateway-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
      PI_GATEWAY_IMAGE: pi-gateway:ci-${{ github.sha }}
      PI_GATEWAY_ADMIN_PASSWORD: ci-admin-password
      POSTGRES_PASSWORD: ci-postgres-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pi-gateway-test-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compose-tls-fixture
          path: ${{ runner.temp }}/compose-tls-bin
      - name: Load the verified local image
        run: docker load --input "$RUNNER_TEMP/pi-gateway-image.tar"
      - name: Start, persist data, recreate, and verify the stack
        env:
          COMPOSE_FILES: ${{ matrix.files }}
          USE_REDIS: ${{ matrix.redis }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a files <<< "$COMPOSE_FILES"
          umask 077
          tls_root=$(mktemp -d "$RUNNER_TEMP/pi-gateway-ci-tls-XXXXXX")
          export PI_GATEWAY_TLS_UID="$(id -u)" PI_GATEWAY_TLS_GID="$(id -g)"
          export PI_GATEWAY_TLS_BINARY="$RUNNER_TEMP/compose-tls-bin/compose-tls"
          export PI_GATEWAY_TLS_CERTS="$tls_root/certs"
          chmod 0755 "$PI_GATEWAY_TLS_BINARY"
          compose=(docker compose --env-file .env.example "${files[@]}" -f .github/compose.tls.yaml)
          state_file="$RUNNER_TEMP/$COMPOSE_PROJECT_NAME.json"
          cleanup() {
            status=$?
            if (( status != 0 )); then
              "${compose[@]}" logs --no-color --tail=120 || true
            fi
            "${compose[@]}" down --volumes --remove-orphans || true
            rm -f "$state_file"
            rm -rf -- "$tls_root"
            exit "$status"
          }
          trap cleanup EXIT
          "$PI_GATEWAY_TLS_BINARY" certs --dir "$PI_GATEWAY_TLS_CERTS"
          compose_version=$(docker compose version --short)
          python3 .github/validate_compose_tls.py --version "$compose_version" --version-only
          "${compose[@]}" config --format json |
            python3 .github/validate_compose_tls.py --version "$compose_version" \
              --uid "$PI_GATEWAY_TLS_UID" --gid "$PI_GATEWAY_TLS_GID"
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180
          python3 .github/compose_smoke.py seed --state "$state_file" --ca-file "$PI_GATEWAY_TLS_CERTS/ca.crt"
          if [[ "$USE_REDIS" == true ]]; then
            "${compose[@]}" exec -T redis redis-cli SET "$COMPOSE_PROJECT_NAME:probe" kept EX 600
          fi
          # Remove containers, but retain named volumes. This tests storage rather
          # than merely restarting a process in the same container filesystem.
          "${compose[@]}" down
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180
          python3 .github/compose_smoke.py verify --state "$state_file" --ca-file "$PI_GATEWAY_TLS_CERTS/ca.crt"
          if [[ "$USE_REDIS" == true ]]; then
            test "$("${compose[@]}" exec -T redis redis-cli --raw GET "$COMPOSE_PROJECT_NAME:probe")" = kept
            "${compose[@]}" exec -T redis redis-cli DEL "$COMPOSE_PROJECT_NAME:probe"
          fi
