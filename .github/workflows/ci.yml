name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare a private Go toolchain for frontend checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          source_root="$(go env GOROOT)"
          private_root="$(mktemp -d /tmp/pi-gateway-go.XXXXXXXX)"
          cp -R "$source_root/." "$private_root/"
          chmod -R go-w "$private_root"
          printf 'GOROOT=%s\nPI_GO_BINARY=%s/bin/go\n' "$private_root" "$private_root" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts
      - name: Check types and frontend contracts, then build
        run: |
          npm run typecheck
          npm run check:i18n
          npm run check:capture
          # check:rules also executes check:sonar-regressions.
          npm run check:rules
          npm run build

  backend:
    # Independent of frontend: no artifact upload/download or service startup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      # Separate from frontend's smaller Go cache; refresh compiled packages
      # when Go sources change rather than keeping an immutable go.sum-only key.
      - name: Cache backend modules and compiled packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go-backend-${{ hashFiles('go.mod', 'go.sum') }}-${{ hashFiles('cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go-backend-${{ hashFiles('go.mod', 'go.sum') }}-
      - name: Prepare an embed placeholder for backend-only checks
        run: |
          mkdir -p internal/webui/dist
          printf '<!doctype html><title>Backend CI</title>\n' > internal/webui/dist/index.html
      - name: Run Go tests and static analysis
        run: |
          go test ./...
          go vet ./...
