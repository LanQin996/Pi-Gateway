name: Publish container image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run browser, race, database and Compose regression before publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run'
    # A local reusable workflow checks out the same commit, including on tags.
    # No publish credentials are exposed to any validation job.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  full-regression:
    if: github.ref_type == 'tag' || inputs.full_regression == true
    uses: ./.github/workflows/full-ci.yml
    permissions:
      contents: read

  publish:
    needs: [verify, full-regression]
    if: >-
      always() && !cancelled() &&
      (needs.verify.result == 'success' ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (needs.full-regression.result == 'success' || needs.full-regression.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build exactly the commit that passed CI, even if the branch moved.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve lowercase image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.workflow_run.head_branch || github.ref_name }},enable=${{ github.event_name == 'workflow_run' || github.ref_type == 'branch' }}
            type=raw,value=edge,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ (github.event.workflow_run.head_branch || github.ref_name) == github.event.repository.default_branch }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.workflow_run.head_branch || github.ref_name }}
          provenance: mode=min
          # Import CI layers, but keep release exports in their own cache scope.
          cache-from: |
            type=gha,version=2,scope=pi-gateway-publish
            type=gha,version=2,scope=pi-gateway-ci
          cache-to: type=gha,version=2,scope=pi-gateway-publish,mode=max
